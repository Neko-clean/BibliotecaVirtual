{% extends 'usuarios/base.html' %}

{% block title %}
Nueva contraseña
{% endblock %}

{% block content %}

<section class="login-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-5">

                <div class="card shadow login-card">

                    <div class="card-body p-5">

                        <h3 class="text-center mb-4">
                            Nueva contraseña
                        </h3>

                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-danger">
                                    {{ message }}
                                </div>
                            {% endfor %}
                        {% endif %}

                        <form method="POST">

                            {% csrf_token %}

                            <div class="mb-3">

                                <label>Nueva contraseña</label>

                                <input
                                    type="password"
                                    name="password"
                                    class="form-control"
                                    required>

                            </div>

                            <div class="mb-4">

                                <label>Confirmar contraseña</label>

                                <input
                                    type="password"
                                    name="confirm_password"
                                    class="form-control"
                                    required>

                            </div>

                            <button
                                class="btn btn-success w-100">

                                Cambiar contraseña

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
