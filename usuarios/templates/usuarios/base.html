<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>
        {% block title %}
        Usuarios
        {% endblock %}
    </title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
    rel="stylesheet">


    <style>

        body {

            background: #f4f6f9;

        }


        .navbar {

            box-shadow: 0 2px 8px rgba(0,0,0,0.1);

        }


        .footer {

            text-align:center;

            padding:20px;

            margin-top:40px;

            color:#777;

        }


        .login-section {


            min-height:80vh;

            display:flex;

            align-items:center;


            background:


            linear-gradient(
            rgba(0,0,0,.6),
            rgba(0,0,0,.6)
            ),


            url('https://images.unsplash.com/photo-1507842217343-583bb7270b66');


            background-size:cover;

            background-position:center;


        }



        .login-card {

            border-radius:15px;

        }



        .login-card input {

            border-radius:10px;

        }



        .login-card button {

            border-radius:10px;

        }


    </style>


    {% block extra_css %}{% endblock %}

</head>



<body>


<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-dark px-3">


    <a class="navbar-brand" href="{% url 'index' %}">
        📚 Biblioteca Virtual
    </a>



    <div>


        {% if user.is_authenticated %}


            <span class="text-white me-3">
                Hola {{ user.username }}
            </span>


            <a href="{% url 'logout' %}" 
               class="btn btn-outline-danger btn-sm">

                Cerrar sesión

            </a>


        {% else %}


            <a href="{% url 'login' %}" 
               class="btn btn-outline-light btn-sm">

                Login

            </a>


            <a href="{% url 'register' %}" 
               class="btn btn-success btn-sm">

                Registro

            </a>


        {% endif %}


    </div>


</nav>



<!-- CONTENIDO -->


{% block content %}

{% endblock %}



<!-- FOOTER -->

<div class="footer">

    © 2026 - Biblioteca Virtual

</div>



{% block extra_js %}

{% endblock %}



</body>

</html>
