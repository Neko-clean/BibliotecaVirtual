{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    

    <title>
        {% block title %}Biblioteca Virtual{% endblock %}
    </title>

    <link rel="stylesheet"
          href="{% static 'bootstrap-5.0.2/css/bootstrap.min.css' %}">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            background-color: #f5f5f5;
        }

        .hero{
            background: linear-gradient(rgba(0,0,0,.7), rgba(0,0,0,.7)),
            url('https://images.unsplash.com/photo-1521587760476-6c12a4b040da');

            background-size: cover;
            background-position: center;

            height: 500px;

            color: white;

            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
        }

        .search-box{
            max-width:700px;
            margin:auto;
        }

        .book-card{
            transition:.3s;
        }

        .book-card:hover{
            transform:translateY(-5px);
        }

        footer{
            background:#212529;
            color:white;
            padding:40px 0;
            margin-top:80px;
        }

        .sidebar{
            background:#1f2937;
            color:white;
            width:290px;
        }

        .sidebar .offcanvas-header{
            background:#111827;
        }

        .avatar{
            width:85px;
            height:85px;
            border-radius:50%;
            background:#0d6efd;
            color:white;
            font-size:34px;
            font-weight:bold;
            display:flex;
            align-items:center;
            justify-content:center;

        }

        .sidebar-item{
            background:transparent;
            color:white;
            border:none;
            padding:14px 24px;
            transition:.3s;
            font-size:16px;
        }

        .sidebar-item i{
            width:30px;
            font-size:18px;
        }

        .sidebar-item:hover{
            background:#374151;
            color:#fff;
            padding-left:34px;
        }

        .sidebar hr{
            border-color:rgba(255,255,255,.12);
        }
    </style>

    {% block extra_css %}
    {% endblock %}

</head>

<body>

    {% include 'includes/navbar.html' %}

    {% include 'includes/sidebar.html' %}

    {% block content %}
    {% endblock %}

    {% include 'includes/footer.html' %}

    <script src="{% static 'bootstrap-5.0.2/js/bootstrap.bundle.min.js' %}">
    </script>

    {% block extra_js %}
    {% endblock %}

</body>

</html>
