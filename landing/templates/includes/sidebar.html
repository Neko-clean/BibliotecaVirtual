<div class="offcanvas offcanvas-start sidebar" tabindex="-1" id="sidebar">

    <div class="offcanvas-header border-bottom">

        <h4 class="fw-bold mb-0">
            <i class="bi bi-book-half me-2"></i>
            Biblioteca Virtual
        </h4>

        <button
            type="button"
            class="btn-close btn-close-white"
            data-bs-dismiss="offcanvas">
        </button>

    </div>

    <div class="offcanvas-body p-0">

        <div class="text-center py-4">

            <div class="avatar mx-auto mb-3">

                {{ user.username|first|upper }}

            </div>

            <h5 class="mb-1">

                {{ user.username }}

            </h5>

            <small class="text-light opacity-75">

                Usuario

            </small>

        </div>

        <hr class="m-0">

        <div class="list-group list-group-flush">

            <a href="{% url 'index' %}" class="list-group-item sidebar-item">

                <i class="bi bi-house-door-fill"></i>

                Inicio

            </a>

            <a href="{% url 'libros' %}" class="list-group-item sidebar-item">

                <i class="bi bi-book-fill"></i>

                Libros

            </a>

            <a href="{% url 'categorias' %}" class="list-group-item sidebar-item">

                <i class="bi bi-grid-fill"></i>

                Categorías

            </a>

            <a href="{% url 'favoritos' %}" class="list-group-item sidebar-item">

                <i class="bi bi-heart-fill"></i>

                Favoritos

            </a>

        </div>

        <hr>

        <div class="list-group list-group-flush">

            <a href="#" class="list-group-item sidebar-item">

                <i class="bi bi-person-circle"></i>

                Mi Perfil

            </a>

            <a href="#" class="list-group-item sidebar-item">

                <i class="bi bi-gear-fill"></i>

                Configuración

            </a>

        </div>

        <hr>

        <div class="list-group list-group-flush">

            <a href="{% url 'logout' %}" class="list-group-item sidebar-item text-danger">

                <i class="bi bi-box-arrow-right"></i>

                Cerrar sesión

            </a>

        </div>

    </div>

</div>
