{% extends 'base.html' %}

{% block title %}
Nueva Categoría
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h3 class="mb-0">

                        <i class="bi bi-plus-circle"></i>

                        Nueva Categoría

                    </h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">

                                Nombre

                            </label>

                            {{ form.nombre }}

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Descripción

                            </label>

                            {{ form.descripcion }}

                        </div>

                        <div class="form-check mb-4">

                            {{ form.estado }}

                            <label class="form-check-label">

                                Categoría activa

                            </label>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-success">

                            <i class="bi bi-check-circle"></i>

                            Guardar

                        </button>

                        <a
                            href="{% url 'categorias' %}"
                            class="btn btn-secondary">

                            Cancelar

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
